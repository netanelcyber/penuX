version: '3.8'

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: penux-openldap
    environment:
      LDAP_ORGANISATION: "PenuX"
      LDAP_DOMAIN: "penux.uk"
      LDAP_BASE_DN: "dc=penux,dc=uk"
      LDAP_ADMIN_DN: "cn=admin,dc=penux,dc=uk"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-admin123}"
    ports:
      - "389:389"
      - "636:636"
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - penux-net
    healthcheck:
      test: ["CMD", "ldapwhoami", "-H", "ldap://localhost", "-D", "cn=admin,dc=penux,dc=uk", "-w", "${LDAP_ADMIN_PASSWORD:-admin123}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: penux-postgres
    environment:
      POSTGRES_DB: penux
      POSTGRES_USER: "${POSTGRES_USER:-penux}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-secure_password}"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - penux-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-penux}"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  api:
    image: netanelcyber/penux-ldap-api:latest
    container_name: penux-api
    environment:
      LDAP_HOST: "ldap://openldap:389"
      LDAP_BASE_DN: "dc=penux,dc=uk"
      LDAP_ADMIN_DN: "cn=admin,dc=penux,dc=uk"
      LDAP_ADMIN_PASSWORD: "${LDAP_ADMIN_PASSWORD:-admin123}"
      DATABASE_URL: "postgresql://${POSTGRES_USER:-penux}:${POSTGRES_PASSWORD:-secure_password}@postgres:5432/penux"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      openldap:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - penux-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  web:
    image: netanelcyber/penux-ldap-web:latest
    container_name: penux-web
    environment:
      API_URL: "${API_URL:-http://api:3000}"
      NODE_ENV: "${NODE_ENV:-production}"
      PORT: "3001"
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - penux-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

volumes:
  ldap_data:
    driver: local
  ldap_config:
    driver: local
  postgres_data:
    driver: local

networks:
  penux-net:
    driver: bridge
