version: '3.8'

services:
  # OpenLDAP - LDAP Server (Public Access)
  openldap:
    image: osixia/openldap:latest
    container_name: ldap-server
    environment:
      LDAP_ORGANISATION: "PenuX"
      LDAP_DOMAIN: "penux.uk"
      LDAP_ADMIN_PASSWORD: "admin123"
      LDAP_CONFIG_PASSWORD: "admin123"
      LDAP_TLS: "true"
    ports:
      - "0.0.0.0:389:389"    # Public LDAP (unencrypted)
      - "0.0.0.0:636:636"    # Public LDAPS (TLS encrypted)
    volumes:
      - ldap_data:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
    networks:
      - penux-network
    healthcheck:
      test: ["CMD", "ldapwhoami", "-H", "ldap://localhost", "-D", "cn=admin,dc=penux,dc=uk", "-w", "admin123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Database for Keycloak
  keycloak-db:
    image: postgres:15
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak123
    volumes:
      - keycloak_db:/var/lib/postgresql/data
    networks:
      - penux-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak - Web UI (Public Access)
  keycloak:
    image: keycloak/keycloak:latest
    container_name: keycloak
    depends_on:
      keycloak-db:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak123
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HOSTNAME: ldap.penux.uk
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_PROXY: edge
      KC_HTTP_ENABLED: true
    ports:
      - "0.0.0.0:80:8080"    # Public HTTP (will use HTTPS via Cloudflare)
      - "0.0.0.0:8443:8443"  # HTTPS port (optional)
    networks:
      - penux-network
    command:
      - "start"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ldap_data:
  ldap_config:
  keycloak_db:

networks:
  penux-network:
    driver: bridge
