<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PenuX Tasks API — Swagger UI</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    .topbar { background: #1F497D !important; }
    .topbar-wrapper img { display: none; }
    .topbar-wrapper::before {
      content: "📋 PenuX Tasks API — Task Board & Email Automation";
      color: white; font-weight: 700; font-size: 1rem;
      font-family: Inter, system-ui, sans-serif;
    }
    .swagger-ui .info .title { color: #1F497D; }
    .swagger-ui .opblock-tag { font-size: 1rem; }
    .swagger-ui .opblock-tag[data-tag="auth"]  { border-left: 4px solid #6B7280; }
    .swagger-ui .opblock-tag[data-tag="tasks"] { border-left: 4px solid #2563EB; }
    .swagger-ui .opblock-tag[data-tag="email"] { border-left: 4px solid #DC2626; }
    .swagger-ui .opblock-tag[data-tag="drafts"] { border-left: 4px solid #D97706; }
    .back-link {
      display: inline-flex; align-items: center; gap: .4rem;
      background: #1F497D; color: white; text-decoration: none;
      padding: .5rem 1.2rem; font-family: Inter, sans-serif;
      font-size: .9rem; font-weight: 600;
    }
    .back-link:hover { background: #163963; }
    .banner {
      background: #EFF6FF; border-bottom: 2px solid #2563EB;
      padding: .7rem 1.5rem; font-family: Inter, sans-serif;
      font-size: .88rem; color: #1e3a8a;
      display: flex; align-items: center; gap: .6rem;
    }
  </style>
</head>
<body>
  <div style="display:flex;align-items:center;justify-content:space-between;padding:.5rem 1.5rem;background:#1F497D;">
    <a href="/" class="back-link">← penux.uk</a>
    <span style="color:rgba(255,255,255,.7);font-size:.82rem;font-family:Inter,sans-serif;">PenuX Tasks API · v1.0.0</span>
  </div>
  <div class="banner">
    🔒 <strong>Internal tool.</strong> All routes except <code>/api/auth</code> are unauthenticated at the HTTP level —
    access control is enforced client-side by the Task Board UI. Don't expose this URL publicly beyond the task board itself.
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({
      spec: {
        "openapi": "3.1.0",
        "info": {
          "title": "PenuX Tasks API",
          "version": "1.0.0",
          "description": "Task board backend for the PenuX outreach/research workflow — task CRUD, follow-up email templates, real email sending (Gmail SMTP), and AI/rule-drafted inbox reply review.\n\nBacked by libSQL (SQLite-compatible) — a local file in development, or a free Turso database in production so data survives redeploys on hosts without a persistent disk.",
          "contact": { "name": "PenuX Research", "url": "https://penux.uk", "email": "nsh531@gmail.com" },
          "license": { "name": "MIT", "url": "https://github.com/netanelcyber/penuX/blob/main/tasks-api/LICENSE" }
        },
        "servers": [
          { "url": "https://penux-1.onrender.com", "description": "Production (Render)" },
          { "url": "http://localhost:3000", "description": "Local dev" }
        ],
        "tags": [
          { "name": "auth",   "description": "Task board login" },
          { "name": "tasks",  "description": "Task CRUD" },
          { "name": "email",  "description": "Follow-up email templates & sending" },
          { "name": "drafts", "description": "Auto-drafted inbox replies" },
          { "name": "health", "description": "Service health / uptime pings" },
          { "name": "predict", "description": "PenuX-AP-Severity prediction endpoints, merged in from the Python FastAPI service (see predict-routes.js) so this one Render deployment serves both the task board and these endpoints" }
        ],
        "paths": {
          "/health": {
            "get": {
              "tags": ["health"], "summary": "Lightweight health check (for uptime/keep-alive pings)",
              "description": "No-op — no DB query, no file read. Used by .github/workflows/render-keepalive.yml to ping every 10 minutes and keep the Render free-tier service from sleeping.",
              "responses": { "200": { "description": "OK", "content": { "application/json": { "example": { "status": "ok", "service": "penux-tasks-api", "timestamp": "2026-07-20T06:00:00.000Z" } } } } }
            }
          },
          "/predict": {
            "post": {
              "tags": ["predict"], "summary": "Predict SAP risk — plain JSON (heuristic)",
              "description": "Ported from PenuX-AP-Severity's logistic BISAP/Ranson-weighted fallback heuristic (no trained ML model on this deployment). All fields optional.\n\n⚠️ Research use only — not validated for clinical use.",
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "$ref": "#/components/schemas/AdmissionInput" }, "examples": {
                  "high_risk": { "summary": "High-risk patient", "value": { "age": 65, "sex": "M", "wbc": 18.5, "crp": 220, "creatinine": 1.8, "glucose": 180, "ldh": 450, "ast": 90, "hematocrit": 47, "bun": 32, "calcium": 7.8, "albumin": 2.9 } },
                  "low_risk": { "summary": "Low-risk patient", "value": { "age": 42, "sex": "F", "wbc": 9.1, "crp": 45, "creatinine": 0.8, "glucose": 110, "ldh": 180, "ast": 38 } }
                } } }
              },
              "responses": { "200": { "description": "Prediction result", "content": { "application/json": { "example": { "severe_ap_probability": 0.3521, "threshold_used": 0.5, "risk_group": "intermediate", "model_version": "0.1.0", "warning": "Research prototype only. Not for clinical use.", "error": null } } } } }
            }
          },
          "/predict/sepsis": {
            "post": {
              "tags": ["predict"], "summary": "Sepsis risk — SIRS + qSOFA + organ dysfunction",
              "description": "SIRS (temp/HR/RR/WBC) + qSOFA (RR≥22, SBP≤100) + Sepsis-3 organ dysfunction markers (creatinine, bilirubin, platelets, lactate, MAP, SpO2). All fields optional.\n\nRisk groups: low (<15%) · moderate (15–40%) · high (40–70%) · critical (>70%).",
              "requestBody": {
                "required": true,
                "content": { "application/json": { "examples": {
                  "septic_shock": { "summary": "Critical — septic shock pattern", "value": { "temperature_c": 39.5, "heart_rate": 118, "respiratory_rate": 26, "systolic_bp": 88, "wbc": 18.5, "lactate": 4.2, "creatinine": 2.4, "platelets": 80, "map_mmhg": 58, "spo2": 90, "age": 72 } },
                  "low_risk": { "summary": "Low — near-normal vitals and labs", "value": { "temperature_c": 37.1, "heart_rate": 78, "respiratory_rate": 16, "systolic_bp": 122, "wbc": 8.5, "spo2": 98, "age": 40 } }
                } } }
              },
              "responses": { "200": { "description": "Sepsis risk result", "content": { "application/json": { "example": { "sepsis_risk_probability": 0.9848, "risk_group": "critical", "sirs_score": 4, "qsofa_score": 2, "criteria_met": ["Fever (39.5°C > 38.3)", "Tachycardia (HR 118 > 90)"], "warning": "Research prototype only. Not for clinical use." } } } } }
            }
          },
          "/predict/deterioration": {
            "post": {
              "tags": ["predict"], "summary": "Clinical deterioration risk — NEWS2 early warning score",
              "description": "NEWS2 (National Early Warning Score 2, Royal College of Physicians) from respiratory rate, SpO2, supplemental oxygen, systolic BP, heart rate, consciousness (AVPU), temperature. All fields optional.\n\nRisk groups: low (0) · low-medium (1-4) · medium (5-6, or any single parameter scoring 3) · high (≥7).",
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeteriorationInput" }, "examples": {
                  "high_risk": { "summary": "High — multiple abnormal vitals", "value": { "respiratory_rate": 26, "spo2": 90, "on_supplemental_oxygen": true, "systolic_bp": 85, "heart_rate": 135, "consciousness_altered": true, "temperature_c": 39.4 } },
                  "low_risk": { "summary": "Low — normal vitals", "value": { "respiratory_rate": 16, "spo2": 98, "systolic_bp": 120, "heart_rate": 75, "temperature_c": 36.8 } }
                } } }
              },
              "responses": { "200": { "description": "NEWS2 result", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/DeteriorationOutput" } } } } }
            }
          },
          "/predict/mortality": {
            "post": {
              "tags": ["predict"], "summary": "30-day in-hospital mortality risk — routine admission variables",
              "description": "Lightweight, explainable logistic combination of age, comorbidity burden, hemodynamic/respiratory instability, consciousness, and organ-dysfunction labs. All fields optional.\n\nRisk groups: low (<5%) · moderate (5–20%) · high (20–50%) · critical (>50%). Not a validated score like APACHE II/SAPS II — see /predict/saps2 for that.",
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "$ref": "#/components/schemas/MortalityInput" }, "examples": {
                  "critical": { "summary": "Critical — elderly, multi-organ dysfunction", "value": { "age": 82, "comorbidity_count": 3, "systolic_bp": 82, "heart_rate": 128, "respiratory_rate": 28, "temperature_c": 35.2, "spo2": 87, "consciousness_altered": true, "creatinine": 3.1, "bilirubin_total": 4.2, "albumin": 2.1, "platelets": 78, "lactate": 5.5 } },
                  "low_risk": { "summary": "Low — young, no comorbidities, normal vitals/labs", "value": { "age": 38, "comorbidity_count": 0, "systolic_bp": 118, "heart_rate": 76, "spo2": 98 } }
                } } }
              },
              "responses": { "200": { "description": "Mortality risk result", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/MortalityOutput" } } } } }
            }
          },
          "/predict/saps2": {
            "post": {
              "tags": ["predict"], "summary": "SAPS II — Simplified Acute Physiology Score II (validated ICU mortality score)",
              "description": "Real, published, externally-validated ICU mortality score (Le Gall et al., 1993) — original point tables + logistic regression equation `logit = -7.7631 + 0.0737×score + 0.9971×ln(score+1)`. Run alongside /predict/mortality to compare a validated score against the lightweight heuristic. All fields optional.",
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SAPS2Input" }, "examples": {
                  "severe": { "summary": "Severe — score ≈ 90, ~97% predicted mortality", "value": { "age": 78, "heart_rate": 128, "systolic_bp": 82, "temperature_c": 39.4, "ventilated_or_cpap": true, "pao2_fio2": 150, "urine_output_l_24h": 0.4, "bun_mg_dl": 90, "wbc": 22, "potassium": 5.5, "sodium": 148, "bicarbonate": 14, "bilirubin_total": 5.0, "gcs": 9, "admission_type": "unscheduled_surgical" } },
                  "mild": { "summary": "Mild — low score, low predicted mortality", "value": { "age": 45, "heart_rate": 90, "systolic_bp": 120, "temperature_c": 37.5, "ventilated_or_cpap": false, "urine_output_l_24h": 1.8, "bun_mg_dl": 18, "wbc": 9, "potassium": 4.0, "sodium": 138, "bicarbonate": 24, "bilirubin_total": 0.8, "gcs": 15, "admission_type": "medical" } }
                } } }
              },
              "responses": { "200": { "description": "SAPS II score and predicted mortality", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/SAPS2Output" } } } } }
            }
          },
          "/predict/polynomial-logit": {
            "post": {
              "tags": ["predict"], "summary": "Polynomial-logit risk index — ln(sigmoid(f(x))), f(x) a degree-2 polynomial",
              "description": "Exploratory scoring construct: f(x) = b0 + Σ(w·zᵢ + w₂·zᵢ²) + w₃·(z_wbc·z_crp) over standardized lab deviations, risk_probability = sigmoid(f(x)), log_risk_index = ln(risk_probability).\n\nReading log_risk_index: closer to 0 = higher risk, more negative = lower risk (opposite of most scores). Original exploratory formula, not a validated clinical instrument. All fields optional.",
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PolynomialLogitInput" }, "examples": {
                  "high_risk": { "summary": "High — multiple abnormal labs", "value": { "age": 72, "wbc": 19.5, "crp": 260, "creatinine": 2.1, "glucose": 210, "ldh": 480, "ast": 140, "hematocrit": 48, "calcium": 7.4, "albumin": 2.6 } },
                  "low_risk": { "summary": "Low — near-normal labs", "value": { "age": 40, "wbc": 8.0, "crp": 20, "creatinine": 0.9, "glucose": 95, "hematocrit": 41, "calcium": 9.4, "albumin": 4.2 } }
                } } }
              },
              "responses": { "200": { "description": "Polynomial-logit risk result", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/PolynomialLogitOutput" } } } } }
            }
          },
          "/models/sweep": {
            "get": {
              "tags": ["predict"], "summary": "294-model hyperparameter sweep results (exploratory, supplementary)",
              "description": "Serves the pre-computed results of a 294-configuration hyperparameter sweep (16 classical ML families), each genuinely 5-fold cross-validated, ranked by AUROC descending — a bundled snapshot copy served from disk (tasks-api/data/model_sweep_271_results.json).\n\n⚠️ Uses a different dataset than /predict's primary SAP severity heuristic — see the response's `caveats` field.",
              "parameters": [
                { "name": "top_n", "in": "query", "required": false, "schema": { "type": "integer", "default": 30 }, "description": "Number of top-ranked configurations to return (clamped to [1, 294])" }
              ],
              "responses": {
                "200": { "description": "Sweep summary + ranked results", "content": { "application/json": { "example": {
                  "dataset": "data/public_sanitized/ap_multiml_sanitized.csv", "n_samples": 1289, "n_features": 59, "positive_rate": 0.8417, "cv_folds": 5,
                  "n_configs_attempted": 294, "n_configs_succeeded": 294, "n_configs_failed": 0, "total_runtime_seconds": 1005.6,
                  "results": [{ "name": "ExtraTrees(n=300,depth=None,criterion=entropy)", "auroc_mean": 0.8561, "auprc_mean": 0.9656, "f1_mean": 0.9258, "accuracy_mean": 0.8666, "status": "ok" }],
                  "caveats": ["This sweep was run on a different, larger dataset than the primary SAP severity heuristic — exploratory/supplementary only."]
                } } } },
                "404": { "description": "Sweep results file not found" }
              }
            }
          },
          "/api/auth": {
            "post": {
              "tags": ["auth"], "summary": "Log in to the task board",
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "type": "object", "properties": { "password": { "type": "string" } }, "required": ["password"] }, "example": { "password": "penux2026" } } }
              },
              "responses": {
                "200": { "description": "Correct password", "content": { "application/json": { "example": { "success": true, "token": "auth_ok" } } } },
                "401": { "description": "Incorrect password", "content": { "application/json": { "example": { "success": false, "error": "Incorrect password" } } } }
              }
            }
          },
          "/api/tasks": {
            "get": {
              "tags": ["tasks"], "summary": "List all tasks",
              "description": "Ordered by status, then due date.",
              "responses": { "200": { "description": "Array of tasks", "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/Task" } } } } } }
            },
            "post": {
              "tags": ["tasks"], "summary": "Create a task",
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "$ref": "#/components/schemas/TaskInput" }, "example": { "title": "Follow up with Dr. Smith", "sub": "Re: collaboration proposal", "due": "2026-08-01", "cat": "follow", "status": "pending" } } }
              },
              "responses": { "200": { "description": "Created task", "content": { "application/json": { "schema": { "$ref": "#/components/schemas/Task" } } } } }
            }
          },
          "/api/tasks/{id}": {
            "put": {
              "tags": ["tasks"], "summary": "Update a task's status",
              "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "integer" } }],
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "type": "object", "properties": { "status": { "type": "string", "enum": ["pending", "urgent", "waiting", "done"] } } }, "example": { "status": "done" } } }
              },
              "responses": { "200": { "description": "Updated", "content": { "application/json": { "example": { "success": true } } } } }
            },
            "delete": {
              "tags": ["tasks"], "summary": "Delete a task",
              "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "integer" } }],
              "responses": { "200": { "description": "Deleted", "content": { "application/json": { "example": { "success": true } } } } }
            }
          },
          "/api/tasks/{id}/email": {
            "post": {
              "tags": ["email"], "summary": "Get a pre-written follow-up email template",
              "description": "Returns a canned email draft for one of the known contacts (buxbaum, chawla, hegyi, frulloni). Does not send anything.",
              "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "integer" }, "description": "Task ID (can be 0 as a placeholder — only the template matters here)" }],
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "type": "object", "properties": { "template": { "type": "string", "enum": ["buxbaum", "chawla", "hegyi", "frulloni"] } }, "required": ["template"] } } }
              },
              "responses": {
                "200": { "description": "Email draft", "content": { "application/json": { "example": { "success": true, "email": { "to": "james.buxbaum@usc.edu", "subject": "Re: PenuX Collaboration — Timeline Coordination", "body": "Dear Dr. Buxbaum, ...", "template": "buxbaum" }, "instruction": "Email draft prepared. Click \"Send Now\" to send it, or \"Open Gmail\" to send manually." } } } },
                "400": { "description": "Unknown template", "content": { "application/json": { "example": { "error": "Template not found" } } } }
              }
            }
          },
          "/api/tasks/{id}/send-email": {
            "post": {
              "tags": ["email"], "summary": "Actually send an email via Gmail SMTP",
              "description": "⚠️ Real, irreversible send. Requires GMAIL_USER / GMAIL_APP_PASSWORD to be configured on the server; auto-marks the task done if id ≠ 0.",
              "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "integer" } }],
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "type": "object", "properties": { "to": { "type": "string" }, "subject": { "type": "string" }, "body": { "type": "string" } }, "required": ["to", "subject", "body"] } } }
              },
              "responses": {
                "200": { "description": "Sent", "content": { "application/json": { "example": { "success": true, "message": "Email sent to james.buxbaum@usc.edu" } } } },
                "503": { "description": "Email sending not configured", "content": { "application/json": { "example": { "error": "Email sending is not configured. Set GMAIL_USER and GMAIL_APP_PASSWORD env vars on the server." } } } }
              }
            }
          },
          "/api/draft-replies": {
            "get": {
              "tags": ["drafts"], "summary": "List pending auto-drafted inbox replies",
              "description": "Populated by the IMAP inbox watcher (reply-watcher.js), which polls for new messages from tracked contacts and drafts a reply for human review — nothing is auto-sent.",
              "responses": { "200": { "description": "Array of pending drafts", "content": { "application/json": { "schema": { "type": "array", "items": { "$ref": "#/components/schemas/DraftReply" } } } } } }
            }
          },
          "/api/draft-replies/{id}": {
            "put": {
              "tags": ["drafts"], "summary": "Edit a draft's body before sending",
              "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "integer" } }],
              "requestBody": {
                "required": true,
                "content": { "application/json": { "schema": { "type": "object", "properties": { "draft_body": { "type": "string" } } } } }
              },
              "responses": { "200": { "description": "Updated", "content": { "application/json": { "example": { "success": true } } } } }
            },
            "delete": {
              "tags": ["drafts"], "summary": "Discard a draft",
              "description": "Soft-delete — marks status as 'discarded' rather than removing the row.",
              "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "integer" } }],
              "responses": { "200": { "description": "Discarded", "content": { "application/json": { "example": { "success": true } } } } }
            }
          },
          "/api/draft-replies/{id}/send": {
            "post": {
              "tags": ["drafts"], "summary": "Send a drafted reply via Gmail SMTP",
              "description": "⚠️ Real, irreversible send. Requires GMAIL_USER / GMAIL_APP_PASSWORD configured on the server.",
              "parameters": [{ "name": "id", "in": "path", "required": true, "schema": { "type": "integer" } }],
              "responses": {
                "200": { "description": "Sent", "content": { "application/json": { "example": { "success": true, "message": "Reply sent to contact@example.com" } } } },
                "404": { "description": "Draft not found", "content": { "application/json": { "example": { "error": "Draft not found" } } } },
                "503": { "description": "Email sending not configured" }
              }
            }
          }
        },
        "components": {
          "schemas": {
            "Task": {
              "type": "object", "title": "Task",
              "properties": {
                "id": { "type": "integer", "example": 1 },
                "title": { "type": "string", "example": "Zoom — Prof. Michael Kochman (UPenn Gastro)" },
                "sub": { "type": "string", "nullable": true, "example": "Confirmed: Tue 10 Jul, 08:00–09:00 EST (15:00 IL)" },
                "due": { "type": "string", "format": "date", "nullable": true, "example": "2026-07-10" },
                "cat": { "type": "string", "enum": ["meeting", "follow", "research", "admin"], "example": "meeting" },
                "status": { "type": "string", "enum": ["pending", "urgent", "waiting", "done"], "example": "pending" },
                "created_at": { "type": "string", "format": "date-time" }
              }
            },
            "TaskInput": {
              "type": "object", "title": "TaskInput",
              "properties": {
                "title": { "type": "string" },
                "sub": { "type": "string" },
                "due": { "type": "string", "format": "date" },
                "cat": { "type": "string", "enum": ["meeting", "follow", "research", "admin"] },
                "status": { "type": "string", "enum": ["pending", "urgent", "waiting", "done"] }
              },
              "required": ["title"]
            },
