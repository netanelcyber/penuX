name: Submit SAP manuscript to medRxiv

on:
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          pip install playwright -q
          playwright install chromium
          playwright install-deps chromium

      - name: Submit to medRxiv
        env:
          MEDRXIV_EMAIL: netanel@penux.uk
          MEDRXIV_PASS: ${{ secrets.MEDRXIV_PASS }}
        run: |
          python3 << 'EOF'
          import asyncio, os, base64
          from playwright.async_api import async_playwright

          EMAIL = os.environ["MEDRXIV_EMAIL"]
          PASS  = os.environ["MEDRXIV_PASS"]
          PDF   = "outreach/sap_manuscript.pdf"

          async def run():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']
                  )
                  ctx = await browser.new_context(
                      viewport={'width':1280,'height':900},
                      user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36'
                  )
                  page = await ctx.new_page()

                  # Step 1: Go to medRxiv submit portal
                  print("Step 1: Loading medRxiv submission portal...")
                  await page.goto('https://submit.medrxiv.org/', wait_until='networkidle', timeout=30000)
                  await page.screenshot(path='/tmp/s1_landing.png')
                  print(f"URL: {page.url}")

                  # Step 2: Register or Login
                  print("\nStep 2: Checking for login/register...")
                  # Try login first
                  try:
                      await page.click('text=Log In', timeout=5000)
                      await page.wait_for_load_state('networkidle', timeout=10000)
                      await page.screenshot(path='/tmp/s2_login.png')
                      print(f"Login page URL: {page.url}")

                      # Fill credentials
                      try:
                          await page.fill('input[name="email"], input[type="email"], #email', EMAIL, timeout=5000)
                          await page.fill('input[name="password"], input[type="password"], #password', PASS, timeout=5000)
                          await page.click('button[type="submit"], input[type="submit"]', timeout=5000)
                          await page.wait_for_load_state('networkidle', timeout=15000)
                          await page.screenshot(path='/tmp/s3_after_login.png')
                          print(f"After login: {page.url}")
                      except Exception as e:
                          print(f"Login form fill error: {e}")
                          await page.screenshot(path='/tmp/s3_error.png')
                  except Exception as e:
                      print(f"No login button: {e}")
                      # Try registration
                      try:
                          await page.click('text=Register', timeout=5000)
                          await page.wait_for_load_state('networkidle', timeout=10000)
                          await page.screenshot(path='/tmp/s2_register.png')
                          print(f"Register page: {page.url}")
                      except Exception as e2:
                          print(f"No register button either: {e2}")

                  # Step 3: Start new submission
                  print("\nStep 3: Starting new submission...")
                  try:
                      await page.click('text=Submit New Preprint', timeout=8000)
                      await page.wait_for_load_state('networkidle', timeout=15000)
                      await page.screenshot(path='/tmp/s4_new_submission.png')
                      print(f"Submission URL: {page.url}")
                  except Exception as e:
                      print(f"Submit button: {e}")
                      # Try alternative
                      try:
                          await page.click('text=New Submission', timeout=5000)
                          await page.wait_for_load_state('networkidle', timeout=10000)
                      except:
                          print("Looking for submit link...")
                          links = await page.query_selector_all('a')
                          for link in links:
                              txt = await link.inner_text()
                              if 'submit' in txt.lower() or 'new' in txt.lower():
                                  print(f"  Found link: {txt}")

                  # Step 4: Fill metadata
                  print("\nStep 4: Filling manuscript metadata...")
                  title = "Comparative Evaluation of Machine Learning and Deep Learning Models for Early Prediction of Severe Acute Pancreatitis: A Multi-Model Study Using the 2012 Revised Atlanta Classification"

                  # Title
                  for sel in ['input[name="title"]', '#title', 'input[placeholder*="title" i]']:
                      try:
                          await page.fill(sel, title, timeout=3000)
                          print(f"✅ Title filled via {sel}")
                          break
                      except: pass

                  # Authors
                  for sel in ['input[name="authors"]', '#authors', 'input[placeholder*="author" i]']:
                      try:
                          await page.fill(sel, 'Netanel Shoshany', timeout=3000)
                          print(f"✅ Authors filled")
                          break
                      except: pass

                  await page.screenshot(path='/tmp/s5_metadata.png')

                  # Step 5: Upload PDF
                  print("\nStep 5: Uploading PDF...")
                  try:
                      file_input = await page.query_selector('input[type="file"]')
                      if file_input:
                          await file_input.set_input_files(PDF)
                          print(f"✅ PDF uploaded: {PDF}")
                          await page.wait_for_load_state('networkidle', timeout=15000)
                          await page.screenshot(path='/tmp/s6_uploaded.png')
                      else:
                          print("No file input found")
                          # Print all inputs for debugging
                          inputs = await page.query_selector_all('input')
                          for inp in inputs:
                              t = await inp.get_attribute('type')
                              n = await inp.get_attribute('name')
                              print(f"  Input type={t} name={n}")
                  except Exception as e:
                      print(f"Upload error: {e}")

                  # Step 6: Submit
                  print("\nStep 6: Submitting...")
                  try:
                      await page.click('button:has-text("Submit"), input[value*="Submit"]', timeout=5000)
                      await page.wait_for_load_state('networkidle', timeout=20000)
                      await page.screenshot(path='/tmp/s7_submitted.png')
                      print(f"✅ Submitted! URL: {page.url}")
                  except Exception as e:
                      print(f"Submit click: {e}")

                  print("\n=== Final page content (first 500 chars) ===")
                  content = await page.content()
                  print(content[:500])

                  await browser.close()

          asyncio.run(run())
          EOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medrxiv-submission-screenshots
          path: /tmp/s*.png
