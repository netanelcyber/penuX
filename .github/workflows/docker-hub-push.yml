name: Build and Push to Docker Hub

# Pushes PenuX LDAP images to Docker Hub.
# Requires repository secrets:
#   DOCKERHUB_USERNAME - your Docker Hub username
#   DOCKERHUB_TOKEN    - a Docker Hub access token (Account Settings -> Security)

on:
  push:
    branches:
      - claude/laughing-cori-jlr7od
      - main
    paths:
      - 'services/openldap/api/**'
      - 'services/openldap/web/**'
      - 'Dockerfile.api'
      - 'Dockerfile.web'
      - '.github/workflows/docker-hub-push.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to publish'
        required: false
        default: 'latest'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          echo "tag=${TAG:-latest}" >> "$GITHUB_OUTPUT"
          echo "user=${{ secrets.DOCKERHUB_USERNAME }}" >> "$GITHUB_OUTPUT"

      - name: Build and push REST API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          tags: |
            ${{ steps.meta.outputs.user }}/penux-ldap-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.user }}/penux-ldap-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web UI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          tags: |
            ${{ steps.meta.outputs.user }}/penux-ldap-web:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.user }}/penux-ldap-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### 🐳 Images Pushed to Docker Hub" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.user }}/penux-ldap-api:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- \`${{ steps.meta.outputs.user }}/penux-ldap-web:${{ steps.meta.outputs.tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Pull with:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.meta.outputs.user }}/penux-ldap-api:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ steps.meta.outputs.user }}/penux-ldap-web:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
