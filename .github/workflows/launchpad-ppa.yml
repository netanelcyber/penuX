name: Push to Launchpad PPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      ppa_name:
        description: 'Launchpad PPA name (e.g. kvmweb)'
        required: true
        default: 'kvmweb'
      launchpad_user:
        description: 'Launchpad username'
        required: true
        default: 'netanelcyber'

jobs:
  upload-ppa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout kvmweb branch
        uses: actions/checkout@v4
        with:
          ref: claude/beautiful-fermi-vkcmzu

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            devscripts debhelper dpkg-dev dput-ng gnupg openssh-client

      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys --keyid-format=long

      - name: Set up SSH key for Launchpad SFTP
        env:
          LAUNCHPAD_SSH_KEY: ${{ secrets.LAUNCHPAD_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$LAUNCHPAD_SSH_KEY" > ~/.ssh/launchpad
          chmod 600 ~/.ssh/launchpad
          ssh-keyscan -p 22 ppa.launchpad.net >> ~/.ssh/known_hosts 2>/dev/null || true
          printf 'Host ppa.launchpad.net\n  IdentityFile ~/.ssh/launchpad\n  StrictHostKeyChecking no\n' \
            >> ~/.ssh/config

      - name: Prepare source package
        run: |
          PKG_VER="1.0.0"
          ORIG_DIR="/tmp/launchpad/kvmweb-${PKG_VER}"
          mkdir -p "$ORIG_DIR"
          cp kvmweb/app.py "$ORIG_DIR/"
          cp -r kvmweb/templates "$ORIG_DIR/"
          cp -r kvmweb/static "$ORIG_DIR/"
          cp kvmweb/kvmweb.service "$ORIG_DIR/" 2>/dev/null || true
          cp -r debian "$ORIG_DIR/debian"
          tar czf /tmp/launchpad/kvmweb_${PKG_VER}.orig.tar.gz \
            -C /tmp/launchpad \
            --exclude="kvmweb-${PKG_VER}/debian" \
            "kvmweb-${PKG_VER}"

      - name: Build and sign source package
        env:
          DEBEMAIL: kvmweb-apt@netanelcyber.github.io
          DEBFULLNAME: kvmweb
        run: |
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format=long \
            | grep '^sec' | head -1 | awk '{print $2}' | cut -d/ -f2)
          echo "Signing with key: $GPG_KEY_ID"
          cd /tmp/launchpad/kvmweb-1.0.0
          dpkg-buildpackage -S -sa -k"$GPG_KEY_ID" 2>&1
          ls -lh /tmp/launchpad/

      - name: Configure dput for Launchpad
        run: |
          printf '[launchpad]\nfqdn = ppa.launchpad.net\nmethod = sftp\nincoming = ~%s/ubuntu/%s\nlogin = %s\n' \
            "${{ github.event.inputs.launchpad_user }}" \
            "${{ github.event.inputs.ppa_name }}" \
            "${{ github.event.inputs.launchpad_user }}" \
            > /tmp/dput.cf

      - name: Upload to Launchpad PPA
        run: |
          dput --config /tmp/dput.cf launchpad \
            /tmp/launchpad/kvmweb_1.0.0-1_source.changes

      - name: Upload source package artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: |
            /tmp/launchpad/*.dsc
            /tmp/launchpad/*.changes
            /tmp/launchpad/*.diff.gz
            /tmp/launchpad/*.orig.tar.gz
