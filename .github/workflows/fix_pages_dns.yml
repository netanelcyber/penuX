name: Fix DNS for GitHub Pages

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix_pages_dns.yml']
  workflow_dispatch:

jobs:
  fix-dns:
    runs-on: ubuntu-latest
    steps:
      - name: Update Cloudflare DNS to GitHub Pages
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          python3 << 'PYEOF'
          import requests, os

          TOKEN   = os.environ["CF_TOKEN"]
          HEADERS = {"Authorization": f"Bearer {TOKEN}", "Content-Type": "application/json"}
          BASE    = "https://api.cloudflare.com/client/v4"
          ZONE_ID = "24699ffac18738a5d05cb627e4bda597"

          # GitHub Pages IPs
          GH_IPS = ["185.199.108.153","185.199.109.153","185.199.110.153","185.199.111.153"]

          # Delete existing A records for penux.uk
          r = requests.get(f"{BASE}/zones/{ZONE_ID}/dns_records?type=A&name=penux.uk", headers=HEADERS, timeout=15)
          for rec in r.json().get("result", []):
              rd = requests.delete(f"{BASE}/zones/{ZONE_ID}/dns_records/{rec['id']}", headers=HEADERS, timeout=15)
              print(f"DEL A {rec['content']}: {rd.json().get('success')}")

          # Add GitHub Pages A records (proxied=False so GitHub handles HTTPS)
          for ip in GH_IPS:
              r2 = requests.post(f"{BASE}/zones/{ZONE_ID}/dns_records", headers=HEADERS,
                  json={"type":"A","name":"penux.uk","content":ip,"ttl":1,"proxied":False},
                  timeout=15)
              d2 = r2.json()
              if d2.get("success"):
                  print(f"OK  A penux.uk -> {ip}")
              else:
                  errs = d2.get("errors",[])
                  if any("exists" in str(e) for e in errs):
                      print(f"SKIP A {ip} already exists")
                  else:
                      print(f"FAIL A {ip}: {errs}")

          # Add CNAME for www -> netanelcyber.github.io (proxied=False)
          r3 = requests.post(f"{BASE}/zones/{ZONE_ID}/dns_records", headers=HEADERS,
              json={"type":"CNAME","name":"www","content":"netanelcyber.github.io","ttl":1,"proxied":False},
              timeout=15)
          d3 = r3.json()
          if d3.get("success"):
              print("OK  CNAME www.penux.uk -> netanelcyber.github.io")
          else:
              errs = d3.get("errors",[])
              if any("exists" in str(e) for e in errs):
                  print("SKIP CNAME www already exists")
              else:
                  print(f"FAIL CNAME: {errs}")

          print("\n✅ Done — penux.uk now points to GitHub Pages (DNS only, no proxy)")
          PYEOF
