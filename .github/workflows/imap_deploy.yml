name: IMAP — Deploy to Server

on:
  push:
    branches: [claude/imap-server-penux-1op6fl, main]
    paths:
      - "imap_server/**"
      - "run_imap.py"
      - "manage_users.py"
      - "webmail.py"
      - "run_webmail.py"
      - "ddns.py"
      - "deploy/**"
      - "tests/test_imap_server.py"
  workflow_dispatch:

jobs:
  test:
    name: Run 39-test IMAP suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 tests/test_imap_server.py

  deploy:
    name: Deploy to mail.penux.uk
    needs: test
    runs-on: ubuntu-latest
    # Only runs if the SSH key secret is configured
    if: ${{ secrets.IMAP_SERVER_SSH_KEY != '' }}
    env:
      # Falls back to hostname so dynamic IPs are no problem
      SSH_HOST: ${{ secrets.IMAP_SERVER_HOST || 'mail.penux.uk' }}
      SSH_USER: ${{ secrets.IMAP_SERVER_USER || 'root' }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.IMAP_SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${SSH_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync code to server
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            imap_server/ run_imap.py manage_users.py \
            webmail.py run_webmail.py ddns.py \
            deploy/ users.example.json \
            "${SSH_USER}@${SSH_HOST}:/opt/penux-imap/"

      - name: Restart services
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            "${SSH_USER}@${SSH_HOST}" << 'ENDSSH'
          systemctl restart penux-imap penux-webmail || true
          # Re-run DDNS immediately so the new code is live before we verify
          systemctl start penux-ddns || true
          systemctl is-active penux-imap && echo "penux-imap: active" || echo "penux-imap: FAILED"
          systemctl is-active penux-webmail && echo "penux-webmail: active" || echo "penux-webmail: FAILED"
          ENDSSH

      - name: Smoke-test IMAP port
        run: |
          sleep 8
          python3 - << 'EOF'
          import socket, sys
          host = "mail.penux.uk"
          try:
              s = socket.create_connection((host, 143), timeout=10)
              g = s.recv(512).decode(errors="replace")
              s.close()
              if "* OK" in g:
                  print("IMAP greeting OK:", g.strip()[:60])
              else:
                  print("Unexpected greeting:", repr(g[:80]))
                  sys.exit(1)
          except Exception as e:
              print(f"IMAP unreachable: {e}")
              sys.exit(1)
          EOF
