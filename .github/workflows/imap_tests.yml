name: IMAP Server Tests

on:
  push:
    branches: ["claude/imap-server-penux-1op6fl", "mimic3+4", "main"]
    paths:
      - "imap_server/**"
      - "tests/test_imap_server.py"
  pull_request:
    paths:
      - "imap_server/**"
      - "tests/test_imap_server.py"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run IMAP server test suite
        run: python3 tests/test_imap_server.py
