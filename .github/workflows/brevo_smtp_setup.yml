name: Setup Brevo SMTP for netanel@penux.uk

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Register Brevo account via internal API
        run: |
          python3 << 'EOF'
          import requests, json, time

          EMAIL    = "netanel@penux.uk"
          PASSWORD = "PenuX2026!Brevo"

          # Step 1: Register via Brevo's onboarding API
          print("Step 1: Registering account...")
          r = requests.post(
              'https://onboarding-api.brevo.com/register',
              json={
                  'email': EMAIL,
                  'password': PASSWORD,
                  'firstName': 'Netanel',
                  'lastName': 'Shoshany',
                  'lang': 'en',
                  'timezone': 'Asia/Jerusalem',
                  'country': 'IL',
                  'companyName': 'PenuX Research'
              },
              headers={
                  'Content-Type': 'application/json',
                  'Origin': 'https://onboarding.brevo.com',
                  'Referer': 'https://onboarding.brevo.com/',
                  'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36'
              },
              timeout=20
          )
          print(f"Register status: {r.status_code}")
          print(f"Response: {r.text[:1000]}")

          if r.status_code in (200, 201):
              d = r.json()
              print(f"\n✅ Account created!")
              token = d.get('token') or d.get('access_token') or d.get('jwt')
              if token:
                  print(f"Token: {token[:40]}...")

                  # Step 2: Get SMTP key
                  print("\nStep 2: Getting SMTP key...")
                  time.sleep(2)
                  r2 = requests.post(
                      'https://api.brevo.com/v3/smtp/key',
                      headers={
                          'Authorization': f'Bearer {token}',
                          'Content-Type': 'application/json'
                      },
                      json={'name': 'PenuX'},
                      timeout=15
                  )
                  print(f"SMTP key status: {r2.status_code}")
                  print(f"SMTP key response: {r2.text[:500]}")
          elif r.status_code == 409:
              print("Account already exists — trying to login...")
              r2 = requests.post(
                  'https://onboarding-api.brevo.com/login',
                  json={'email': EMAIL, 'password': PASSWORD},
                  headers={
                      'Content-Type': 'application/json',
                      'Origin': 'https://onboarding.brevo.com',
                  },
                  timeout=15
              )
              print(f"Login: {r2.status_code} {r2.text[:500]}")
          else:
              print(f"Unexpected: {r.status_code}")

          EOF
