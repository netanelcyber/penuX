name: Setup SMTP for netanel@penux.uk via forwardemail.net

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Create forwardemail account and get SMTP credentials
        run: |
          python3 << 'EOF'
          import requests, json, base64

          EMAIL    = "netanel@penux.uk"
          PASSWORD = "PenuX2026!"
          AUTH     = base64.b64encode(f"{EMAIL}:{PASSWORD}".encode()).decode()
          HDRS     = {"Authorization": f"Basic {AUTH}", "Content-Type": "application/json"}
          BASE     = "https://api.forwardemail.net/v1"

          # Create/verify account
          print("Step 1: Account info...")
          r = requests.get(f"{BASE}/account", headers=HDRS, timeout=10)
          d = r.json()
          print(f"Account: {r.status_code}")
          print(f"Plan: {d.get('plan')}")
          print(f"Email: {d.get('email')}")

          # Check alias exists
          print("\nStep 2: Checking alias netanel@penux.uk...")
          r2 = requests.get(f"{BASE}/domains/penux.uk/aliases", headers=HDRS, timeout=10)
          print(f"Aliases: {r2.status_code} {r2.text[:300]}")

          # Generate password for SMTP
          print("\nStep 3: Creating alias password for SMTP...")
          r3 = requests.post(f"{BASE}/domains/penux.uk/aliases",
              headers=HDRS,
              json={
                  "name": "netanel",
                  "description": "PenuX research account",
                  "recipients": ["nsh531@gmail.com"],
                  "has_recipient_verification": False,
                  "is_enabled": True
              },
              timeout=10
          )
          d3 = r3.json()
          print(f"Alias create: {r3.status_code} {json.dumps(d3)[:400]}")

          # Get or create SMTP password
          alias_id = d3.get('id') or (d3.get('data', {}) or {}).get('id')
          if alias_id:
              r4 = requests.post(f"{BASE}/domains/penux.uk/aliases/{alias_id}/generate-password",
                  headers=HDRS, json={}, timeout=10)
              d4 = r4.json()
              print(f"SMTP password: {r4.status_code} {json.dumps(d4)[:400]}")
              smtp_pass = d4.get('password') or d4.get('generated_password')
          else:
              smtp_pass = None

          print("\n" + "="*50)
          print("📧 SMTP SETTINGS FOR netanel@penux.uk")
          print("="*50)
          print(f"Host:     smtp.forwardemail.net")
          print(f"Port:     465 (SSL) or 587 (TLS)")
          print(f"User:     netanel@penux.uk")
          print(f"Password: {smtp_pass or PASSWORD + ' (account password)'}")
          print(f"From:     netanel@penux.uk")
          print("="*50)
          print("\nIMAPSettings (read inbox):")
          print(f"Host: imap.forwardemail.net")
          print(f"Port: 993")
          print(f"User: netanel@penux.uk")
          print(f"Pass: {smtp_pass or PASSWORD}")
          EOF
