name: ForwardEmail - Get verification TXT and setup SMTP

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Get verification TXT and setup domain
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests, json, base64, re

          CF_TOKEN = "${{ env.CF_TOKEN }}"
          import os
          CF_TOKEN = os.environ["CF_TOKEN"]
          ZONE_ID  = "24699ffac18738a5d05cb627e4bda597"
          CF_BASE  = "https://api.cloudflare.com/client/v4"
          CF_HDRS  = {"Authorization": f"Bearer {CF_TOKEN}", "Content-Type": "application/json"}

          EMAIL    = "netanel@penux.uk"
          PASSWORD = "PenuX2026!"

          # Basic auth with email:password
          AUTH = base64.b64encode(f"{EMAIL}:{PASSWORD}".encode()).decode()
          HDRS = {"Authorization": f"Basic {AUTH}", "Content-Type": "application/json",
                  "Accept": "application/json"}

          # Test auth
          print("Step 1: Auth test...")
          r = requests.get('https://api.forwardemail.net/v1/account', headers=HDRS, timeout=10)
          print(f"Account: {r.status_code} {r.text[:300]}")

          # Add domain to account
          print("\nStep 2: Adding domain penux.uk to account...")
          r2 = requests.post('https://api.forwardemail.net/v1/domains',
              headers=HDRS,
              json={"domain": "penux.uk", "plan": "free"},
              timeout=10)
          print(f"Add domain: {r2.status_code} {r2.text[:500]}")

          d2 = r2.json() if r2.headers.get('content-type','').startswith('application/json') else {}

          # Get domain info including verification TXT
          print("\nStep 3: Getting domain verification info...")
          r3 = requests.get('https://api.forwardemail.net/v1/domains/penux.uk', headers=HDRS, timeout=10)
          print(f"Domain info: {r3.status_code} {r3.text[:800]}")

          d3 = r3.json() if r3.headers.get('content-type','').startswith('application/json') else {}
          verification_record = d3.get('verification_record') or d3.get('verification')

          if verification_record:
              txt_value = f"forward-email-site-verification={verification_record}"
              print(f"\n✅ Verification TXT: {txt_value}")

              # Add to Cloudflare
              r4 = requests.post(f"{CF_BASE}/zones/{ZONE_ID}/dns_records",
                  headers=CF_HDRS,
                  json={"type":"TXT","name":"penux.uk","content":txt_value,"ttl":1},
                  timeout=15)
              d4 = r4.json()
              if d4.get('success'):
                  print(f"✅ Added to Cloudflare!")
              else:
                  errs = d4.get('errors',[])
                  if any('exists' in str(e) for e in errs):
                      print(f"⚠️  TXT already exists in Cloudflare")
                  else:
                      print(f"❌ CF error: {errs}")

              # Verify domain via API
              import time; time.sleep(3)
              print("\nStep 4: Verifying domain...")
              r5 = requests.get(f'https://api.forwardemail.net/v1/domains/penux.uk/verify-records',
                  headers=HDRS, timeout=15)
              print(f"Verify: {r5.status_code} {r5.text[:500]}")

          # Get aliases for SMTP password
          print("\nStep 5: Getting alias SMTP password...")
          r6 = requests.get('https://api.forwardemail.net/v1/domains/penux.uk/aliases', headers=HDRS, timeout=10)
          print(f"Aliases: {r6.status_code} {r6.text[:500]}")

          d6 = r6.json() if r6.headers.get('content-type','').startswith('application/json') else []
          if isinstance(d6, list) and d6:
              alias_id = d6[0].get('id')
              if alias_id:
                  r7 = requests.post(
                      f'https://api.forwardemail.net/v1/domains/penux.uk/aliases/{alias_id}/generate-password',
                      headers=HDRS, json={}, timeout=10)
                  print(f"Gen pass: {r7.status_code} {r7.text[:300]}")
                  smtp_pass = r7.json().get('password','') if r7.status_code == 200 else PASSWORD
              else:
                  smtp_pass = PASSWORD
          else:
              smtp_pass = PASSWORD

          print("\n" + "="*55)
          print("📧 SMTP SETTINGS — netanel@penux.uk")
          print("="*55)
          print("Host:     smtp.forwardemail.net")
          print("Port:     465 (SSL) or 587 (TLS)")
          print(f"User:     netanel@penux.uk")
          print(f"Password: {smtp_pass}")
          print("From:     Netanel Shoshany <netanel@penux.uk>")
          print("="*55)
          print("\n📥 IMAP (read inbox):")
          print("Host:     imap.forwardemail.net:993")
          print(f"User/Pass: same as above")
          EOF
