name: Setup SMTP for netanel@penux.uk

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Try multiple SMTP providers via API
        env:
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
        run: |
          python3 << 'EOF'
          import requests, json, time

          EMAIL    = "netanel@penux.uk"
          PASSWORD = "PenuX2026!"

          def try_provider(name, test_fn):
              print(f"\n{'='*40}")
              print(f"Trying: {name}")
              try:
                  test_fn()
              except Exception as e:
                  print(f"FAILED: {e}")

          # ── 1. Resend API (no browser needed) ────────────────────────────
          def try_resend():
              r = requests.post('https://api.resend.com/auth/signup',
                  json={'email': EMAIL, 'password': PASSWORD, 'name': 'Netanel Shoshany'},
                  headers={'Content-Type': 'application/json'}, timeout=10)
              print(f"Resend signup: {r.status_code} {r.text[:200]}")

          try_provider("Resend API", try_resend)

          # ── 2. Mailjet ───────────────────────────────────────────────────
          def try_mailjet():
              r = requests.post('https://app.mailjet.com/signup',
                  json={'Email': EMAIL, 'Password': PASSWORD,
                        'Firstname': 'Netanel', 'Lastname': 'Shoshany'},
                  headers={'Content-Type': 'application/json'}, timeout=10)
              print(f"Mailjet: {r.status_code} {r.text[:200]}")

          try_provider("Mailjet", try_mailjet)

          # ── 3. smtp2go API ───────────────────────────────────────────────
          def try_smtp2go():
              r = requests.post('https://api.smtp2go.com/v3/users/account',
                  json={'username': 'penux', 'email': EMAIL,
                        'password': PASSWORD, 'timezone': 'Asia/Jerusalem'},
                  headers={'Content-Type': 'application/json'}, timeout=10)
              print(f"smtp2go: {r.status_code} {r.text[:200]}")

          try_provider("smtp2go", try_smtp2go)

          # ── 4. Postmark ──────────────────────────────────────────────────
          def try_postmark():
              r = requests.post('https://api.postmarkapp.com/accounts',
                  json={'Email': EMAIL, 'Password': PASSWORD,
                        'FirstName': 'Netanel', 'LastName': 'Shoshany'},
                  headers={'Content-Type': 'application/json',
                            'Accept': 'application/json'}, timeout=10)
              print(f"Postmark: {r.status_code} {r.text[:200]}")

          try_provider("Postmark", try_postmark)

          # ── 5. Elastic Email ─────────────────────────────────────────────
          def try_elastic():
              r = requests.post('https://api.elasticemail.com/v2/account/register',
                  data={'email': EMAIL, 'password': PASSWORD,
                        'firstName': 'Netanel', 'lastName': 'Shoshany',
                        'affiliateCode': ''},
                  headers={'Content-Type': 'application/x-www-form-urlencoded'}, timeout=10)
              print(f"Elastic Email: {r.status_code} {r.text[:300]}")

          try_provider("Elastic Email", try_elastic)

          # ── 6. forwardemail.net account ──────────────────────────────────
          def try_forwardemail():
              r = requests.post('https://api.forwardemail.net/v1/account',
                  json={'email': EMAIL, 'password': PASSWORD},
                  headers={'Content-Type': 'application/json'}, timeout=10)
              print(f"forwardemail: {r.status_code} {r.text[:300]}")

          try_provider("forwardemail.net", try_forwardemail)

          EOF
