name: Setup Brevo SMTP for netanel@penux.uk

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          pip install playwright -q
          playwright install chromium
          playwright install-deps chromium

      - name: Create Brevo account via internal API
        run: |
          python3 << 'EOF'
          import asyncio, json, re
          from playwright.async_api import async_playwright

          EMAIL    = "netanel@penux.uk"
          PASSWORD = "PenuX2026!Brevo"

          async def run():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']
                  )
                  ctx = await browser.new_context(
                      viewport={'width':1280,'height':900},
                      user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36'
                  )

                  # Capture network requests to find internal registration API
                  api_calls = []
                  async def on_request(req):
                      if 'api' in req.url and req.method == 'POST':
                          api_calls.append({'url': req.url, 'method': req.method})

                  page = await ctx.new_page()
                  page.on('request', on_request)

                  await page.goto('https://onboarding.brevo.com/account/register', wait_until='networkidle', timeout=30000)

                  # Fill form
                  await page.fill('#email', EMAIL, timeout=5000)
                  await page.fill('#password', PASSWORD, timeout=5000)

                  # Intercept the API call made on submit
                  async with page.expect_response(lambda r: 'api' in r.url or 'register' in r.url, timeout=15000) as resp_info:
                      await page.click('#register-form-create-button', timeout=5000)

                  try:
                      resp = await resp_info.value
                      print(f"API called: {resp.url}")
                      print(f"Status: {resp.status}")
                      body = await resp.text()
                      print(f"Response: {body[:500]}")
                  except Exception as e:
                      print(f"No API response captured: {e}")

                  await page.wait_for_load_state('networkidle', timeout=15000)
                  print(f"Final URL: {page.url}")
                  await page.screenshot(path='/tmp/b_final.png')

                  # Check if redirected (success)
                  if 'register' not in page.url:
                      print("✅ Signup successful!")
                      print(f"URL: {page.url}")
                  else:
                      # Try direct API call bypassing captcha
                      print("\nTrying direct API registration...")
                      import requests
                      r = requests.post('https://app.brevo.com/api/register', json={
                          'email': EMAIL, 'password': PASSWORD,
                          'firstName': 'Netanel', 'lastName': 'Shoshany',
                          'lang': 'en'
                      }, headers={'Content-Type': 'application/json'}, timeout=15)
                      print(f"Direct API: {r.status_code} {r.text[:300]}")

                  await browser.close()
                  print("\nAPI calls intercepted:", api_calls)

          asyncio.run(run())
          EOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brevo-debug
          path: /tmp/b*.png
