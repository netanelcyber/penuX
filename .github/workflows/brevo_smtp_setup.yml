name: Setup Brevo SMTP for netanel@penux.uk

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          pip install playwright -q
          playwright install chromium
          playwright install-deps chromium

      - name: Create Brevo account
        run: |
          python3 << 'EOF'
          import asyncio
          from playwright.async_api import async_playwright

          EMAIL    = "netanel@penux.uk"
          PASSWORD = "PenuX2026!Brevo"

          async def run():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']
                  )
                  ctx = await browser.new_context(
                      viewport={'width':1280,'height':900},
                      user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36'
                  )
                  page = await ctx.new_page()

                  print("Opening Brevo signup...")
                  await page.goto('https://onboarding.brevo.com/account/register', wait_until='networkidle', timeout=30000)
                  await page.screenshot(path='/tmp/b1.png')
                  print(f"URL: {page.url}")

                  # Dump all inputs to find correct selectors
                  inputs = await page.evaluate('''() => {
                      return Array.from(document.querySelectorAll("input")).map(i => ({
                          type: i.type, name: i.name, id: i.id,
                          placeholder: i.placeholder, "aria-label": i.getAttribute("aria-label")
                      }));
                  }''')
                  print("Inputs found:", inputs)

                  # Try filling by placeholder or label text
                  for inp in inputs:
                      print(f"  → type={inp['type']} name={inp['name']} id={inp['id']} placeholder={inp['placeholder']}")

                  # Fill fields dynamically based on what's there
                  filled = []
                  for inp in inputs:
                      ph = (inp.get('placeholder') or '').lower()
                      nm = (inp.get('name') or '').lower()
                      id_ = (inp.get('id') or '').lower()
                      sel = f"#{inp['id']}" if inp.get('id') else f"[name='{inp['name']}']" if inp.get('name') else None
                      if not sel: continue

                      if any(x in ph+nm+id_ for x in ['first','prénom','fname','given']):
                          await page.fill(sel, 'Netanel', timeout=3000)
                          print(f"✅ First name via {sel}")
                          filled.append('firstname')
                      elif any(x in ph+nm+id_ for x in ['last','nom','lname','family','surname']):
                          await page.fill(sel, 'Shoshany', timeout=3000)
                          print(f"✅ Last name via {sel}")
                          filled.append('lastname')
                      elif inp['type'] == 'email' or 'email' in ph+nm+id_:
                          await page.fill(sel, EMAIL, timeout=3000)
                          print(f"✅ Email via {sel}")
                          filled.append('email')
                      elif inp['type'] == 'password' or 'password' in ph+nm+id_:
                          await page.fill(sel, PASSWORD, timeout=3000)
                          print(f"✅ Password via {sel}")
                          filled.append('password')

                  await page.screenshot(path='/tmp/b2_filled.png')

                  # Find and click submit
                  buttons = await page.evaluate('''() => {
                      return Array.from(document.querySelectorAll("button,input[type=submit]")).map(b => ({
                          type: b.type, text: b.innerText || b.value, id: b.id
                      }));
                  }''')
                  print("Buttons:", buttons)

                  try:
                      await page.click('button[type="submit"]', timeout=5000)
                      await page.wait_for_load_state('networkidle', timeout=20000)
                      await page.screenshot(path='/tmp/b3_after.png')
                      print(f"After submit: {page.url}")
                  except Exception as e:
                      print(f"Submit error: {e}")

                  await browser.close()

          asyncio.run(run())
          EOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brevo-debug
          path: /tmp/b*.png
