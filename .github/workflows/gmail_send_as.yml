name: Add Gmail Send-As netanel@penux.uk

on:
  workflow_dispatch:

jobs:
  add-send-as:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright
        run: |
          pip install playwright -q
          playwright install chromium
          sudo apt-get install -y -q libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libasound2t64 \
            libxshmfence1 libpango-1.0-0 libcairo2 libcups2 libdbus-1-3 libexpat1 \
            libfontconfig1 libglib2.0-0 libnspr4 libx11-6 libx11-xcb1 libxcb1 \
            libxext6 libxrender1 libxtst6

      - name: Add Send-As in Gmail
        env:
          GMAIL_EMAIL: ${{ secrets.GMAIL_EMAIL }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
        run: |
          python3 << 'EOF'
          import asyncio, os
          from playwright.async_api import async_playwright

          EMAIL = os.environ["GMAIL_EMAIL"]
          PASS  = os.environ["GMAIL_PASS"]

          async def run():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=['--no-sandbox','--disable-dev-shm-usage','--disable-gpu']
                  )
                  ctx = await browser.new_context(
                      viewport={'width':1280,'height':900},
                      user_agent='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0.0.0 Safari/537.36'
                  )
                  page = await ctx.new_page()

                  # Sign in to Google
                  print("Step 1: Signing in to Google...")
                  await page.goto('https://accounts.google.com/signin/v2/identifier', wait_until='networkidle', timeout=30000)
                  await page.fill('input[type="email"]', EMAIL, timeout=5000)
                  await page.click('#identifierNext', timeout=5000)
                  await page.wait_for_selector('input[type="password"]', timeout=10000)
                  await page.fill('input[type="password"]', PASS, timeout=5000)
                  await page.click('#passwordNext', timeout=5000)
                  await page.wait_for_load_state('networkidle', timeout=15000)
                  print(f"Signed in. URL: {page.url}")
                  await page.screenshot(path='/tmp/step1_signin.png')

                  # Go directly to Gmail Send-As settings
                  print("Step 2: Opening Gmail Accounts settings...")
                  await page.goto('https://mail.google.com/mail/u/0/#settings/accounts', wait_until='networkidle', timeout=30000)
                  await page.screenshot(path='/tmp/step2_settings.png')
                  print(f"Settings URL: {page.url}")

                  # Click "Add another email address"
                  print("Step 3: Adding email address...")
                  try:
                      await page.click('text=Add another email address', timeout=8000)
                  except:
                      # Try link variant
                      await page.click('a:has-text("Add another email")', timeout=5000)
                  await page.wait_for_load_state('networkidle', timeout=10000)
                  await page.screenshot(path='/tmp/step3_add_email.png')
                  print(f"After click URL: {page.url}")

                  # Handle popup
                  popup = None
                  for frame in page.frames:
                      if 'plus.google' in frame.url or 'mail.google' in frame.url:
                          popup = frame
                          break

                  target = page
                  pages = ctx.pages
                  if len(pages) > 1:
                      target = pages[-1]
                      await target.wait_for_load_state('networkidle', timeout=10000)
                      await target.screenshot(path='/tmp/step3b_popup.png')
                      print(f"Popup URL: {target.url}")

                  # Fill name and email
                  try:
                      await target.fill('input[name="name"]', 'Netanel Shoshany', timeout=5000)
                      print("✅ Name filled")
                  except Exception as e:
                      print(f"Name: {e}")

                  try:
                      await target.fill('input[name="email"]', 'netanel@penux.uk', timeout=5000)
                      print("✅ Email filled: netanel@penux.uk")
                  except Exception as e:
                      print(f"Email: {e}")

                  # Uncheck "Treat as alias" if present
                  try:
                      cb = await target.query_selector('input[name="isAlias"]')
                      if cb and await cb.is_checked():
                          await cb.uncheck()
                  except: pass

                  await target.screenshot(path='/tmp/step4_filled.png')

                  # Next step
                  try:
                      await target.click('button:has-text("Next Step"), input[value="Next Step"]', timeout=5000)
                      await target.wait_for_load_state('networkidle', timeout=10000)
                      await target.screenshot(path='/tmp/step5_next.png')
                      print("✅ Clicked Next Step")
                  except Exception as e:
                      print(f"Next: {e}")

                  # Send verification
                  try:
                      await target.click('button:has-text("Send Verification"), input[value*="Send Verification"]', timeout=5000)
                      await target.wait_for_load_state('networkidle', timeout=10000)
                      await target.screenshot(path='/tmp/step6_sent.png')
                      print("✅ Verification email sent to netanel@penux.uk")
                      print("   It will arrive at nsh531@gmail.com via forwarding")
                  except Exception as e:
                      print(f"Send verification: {e}")
                      await target.screenshot(path='/tmp/step6_error.png')

                  await browser.close()

          asyncio.run(run())
          EOF

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gmail-screenshots
          path: /tmp/step*.png
