version: '3.8'

services:
  openldap:
    image: osixia/openldap:1.5.0
    container_name: penux-openldap
    ports:
      - "389:389"
      - "636:636"
    environment:
      LDAP_LOG_LEVEL: 256
      LDAP_ORGANISATION: "PenuX"
      LDAP_DOMAIN: "penux.uk"
      LDAP_BASE_DN: "dc=penux,dc=uk"
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:-admin123}
      LDAP_CONFIG_PASSWORD: ${LDAP_CONFIG_PASSWORD:-config123}
      LDAP_READONLY_USER: "false"
      LDAP_RFC2307BIS_SCHEMA: "false"
      LDAP_BACKEND: "mdb"
      LDAP_TLS_CRT_FILENAME: "server.crt"
      LDAP_TLS_KEY_FILENAME: "server.key"
      LDAP_TLS_CA_CRT_FILENAME: "ca.crt"
      LDAP_TLS_ENFORCE: "false"
      LDAP_TLS_VERIFY_CLIENT: "never"
      LDAP_REPLICATION: "false"
      LDAP_REMOVE_CONFIG_AFTER_SETUP: "true"
      LDAP_SSL_HELPER_PREFIX: "ldap"
      KEEP_EXISTING_CONFIG: "false"
      LDAP_PREVENT_FAIL: "false"
    volumes:
      - ldap_database:/var/lib/ldap
      - ldap_config:/etc/ldap/slapd.d
      - ./certs:/container/service/slapd/assets/certs
      - ./bootstrap.ldif:/container/service/slapd/bootstrap/bootstrap.ldif
    networks:
      - penux_network
    healthcheck:
      test: ["CMD", "ldapwhoami", "-H", "ldap://localhost", "-D", "cn=admin,dc=penux,dc=uk", "-w", "${LDAP_ADMIN_PASSWORD:-admin123}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  phpldapadmin:
    image: osixia/phpldapadmin:0.9.0
    container_name: penux-phpldapadmin
    ports:
      - "6443:443"
      - "80:80"
    environment:
      PHPLDAPADMIN_LDAP_HOSTS: "openldap"
      PHPLDAPADMIN_HTTPS: "false"
      PHPLDAPADMIN_LDAP_CLIENT_ADD_SERVERS: "true"
      PHPLDAPADMIN_SERVER_ADMIN: "admin@penux.uk"
    depends_on:
      openldap:
        condition: service_healthy
    networks:
      - penux_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ldap_database:
    driver: local
  ldap_config:
    driver: local

networks:
  penux_network:
    driver: bridge
